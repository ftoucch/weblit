[project]
name = "novelty-checker"
version = "0.1.0"
description = "Pre-research semantic intelligence — find gaps before you start"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    # Web framework
    "fastapi>=0.116.1",
    "uvicorn[standard]>=0.30.6",

    # HTTP client
    "httpx>=0.28.1",
    "tenacity>=9.0.0",

    # Database — Postgres + pgvector for both relational data and embeddings
    "sqlalchemy>=2.0.42",
    "asyncpg>=0.30.0",
    "pgvector>=0.3.6",
    "greenlet>=3.0.0",

    # Embeddings / ML
    "sentence-transformers>=3.3.1",
    "torch>=2.6; platform_system != 'Darwin'",
    "transformers>=4.45.2",

    # Config / validation
    "pydantic>=2.9.2",
    "pydantic-settings>=2.10.1",
    "email-validator>=2.1.0",
    "python-dotenv>=1.1.1",
    "pyjwt<3.0.0,>=2.8.0",
    "pwdlib[argon2,bcrypt]>=0.3.0",
    "python-multipart<1.0.0,>=0.0.7",
    "pypdf>=4.0.0",
    "beautifulsoup4>=4.12.0",

    # Testing
    "pytest>=8.4.1",
    "pytest-asyncio>=0.24.0",
    "pytest-dotenv>=0.5.2",
    "httpx>=0.28.1",
]

[tool.pytest.ini_options]
pythonpath = "."
asyncio_mode = "auto"
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "session"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]