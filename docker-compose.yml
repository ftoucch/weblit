version: "3.9"

services:

  # ── FastAPI application ────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: weblit_api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      - HF_HOME=/home/appuser/.cache/huggingface
      - SENTENCE_TRANSFORMERS_HOME=/home/appuser/.cache/huggingface
    volumes:
      - ./app:/project/app          # hot-reload during dev
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - weblit-network
    restart: unless-stopped

  # ── Postgres + pgvector (relational data + embeddings) ────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: weblit_postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-weblit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-weblit}
      POSTGRES_DB: ${POSTGRES_DB:-weblit}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-weblit}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - weblit-network
    restart: unless-stopped

  # ── mailhog — local email preview only, not deployed ───────────────────────
  mailhog:
    image: mailhog/mailhog:latest
    container_name: weblit_mailhog
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - weblit-network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  weblit-network:
    driver: bridge
